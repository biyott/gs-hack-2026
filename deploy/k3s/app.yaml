apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gs-safety-data
  namespace: gs-safety
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gs-safety
  namespace: gs-safety
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gs-safety
  template:
    metadata:
      labels:
        app: gs-safety
    spec:
      nodeSelector:
        kubernetes.io/hostname: __NODE_HOSTNAME__
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: __IMAGE__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: gs-safety-env
          env:
            - name: RAG_LLM_PROVIDER
              value: openai
            - name: DATABASE_PATH
              value: /data/safety.sqlite
            - name: RAG_EMBEDDING_LOCAL_PATH
              value: /app/data/knowledge/runtime/models/Xenova/multilingual-e5-small
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gs-safety-data
---
apiVersion: v1
kind: Service
metadata:
  name: gs-safety
  namespace: gs-safety
spec:
  type: NodePort
  selector:
    app: gs-safety
  ports:
    - port: 3000
      targetPort: http
      nodePort: 30080
